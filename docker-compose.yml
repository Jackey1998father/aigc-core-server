  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     - ./nginx/cert:/etc/nginx/cert:ro
  #     - ./logs/nginx:/var/log/nginx
  #   depends_on:
  #     - api
  #   networks:
  #     - aigc-network

networks:
  aigc-network:
    driver: bridge

volumes:
  aigc-logs:
