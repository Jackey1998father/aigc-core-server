services:
  # ==================== FastAPI 服务 ====================
  api:
    build: .
    container_name: aigc-api
    restart: unless-stopped
    command: ["api"]
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/var/log/aigc-server
      - ./data:/app/data
    networks:
      - aigc-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== Celery 文档解析 Worker ====================
  parse-worker:
    build: .
    container_name: aigc-parse-worker
    restart: unless-stopped
    command: ["parse-worker"]
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/var/log/aigc-server
      - ./data:/app/data
    networks:
      - aigc-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ==================== Celery 向量化 Worker ====================
  embed-worker:
    build: .
    container_name: aigc-embed-worker
    restart: unless-stopped
    command: ["embed-worker"]
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/var/log/aigc-server
      - ./data:/app/data
    networks:
      - aigc-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==================== Nginx（可选，前端部署用）====================
