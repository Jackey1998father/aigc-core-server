[tool.poetry]
name = "aigc-core-server"
version = "0.1.0"
description = "AIGC Core Server based on FastAPI"
authors = ["aigc-team"]
#readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.135"
uvicorn = {version = "^0.41", extras = ["standard"]}
pydantic = "^2.12"
pydantic-settings = "^2.13"
langchain = "^1.2"
langchain-core = "^1.2"
langchain-openai = "^1.1"
langgraph = "^1.1"
openai = "^2.28"
httpx = "^0.28"
python-dotenv = "^1.2"
tiktoken = "^0.12"
requests = "^2.32"
pymysql = "^1.1"
dbutils = "^3.1"
minio = "^7.2"
python-multipart = "^0.0.20"
celery = {version = "^5.5", extras = ["redis"]}
redis = "^5.2"
# 轻量文档解析
pymupdf = "^1.25"
pymupdf4llm = "^0.0.20"
python-docx = "^1.2"
python-pptx = "^1.0"
openpyxl = "^3.1"
# 文本切分（Parent-Child）
langchain-text-splitters = "^0.3"
pymilvus = "2.6.17"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
ipython = "^8.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
