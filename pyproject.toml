[tool.poetry]
name = "aigc-core-server"
version = "0.1.0"
description = "AIGC Core Server based on FastAPI"
authors = ["aigc-team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.135"
uvicorn = {version = "^0.41", extras = ["standard"]}
pydantic = "^2.12"
pydantic-settings = "^2.13"
langchain = "^1.2"
langchain-core = "^1.2"
langchain-openai = "^1.1"
langgraph = "^1.1"
openai = "^2.28"
httpx = "^0.28"
python-dotenv = "^1.2"
tiktoken = "^0.12"
requests = "^2.32"
pymysql = "^1.1"
dbutils = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
ipython = "^8.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
